spring.application.name=student-management
server.port=8080
# Listen on all interfaces so a phone on the same Wi-Fi can reach the API
server.address=0.0.0.0

# ---- Database (PostgreSQL by default; override with env vars) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/studentdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# For MySQL use:
#   DB_URL=jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true&serverTimezone=UTC
#   DB_USERNAME=root  DB_PASSWORD=...

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# MUST be at least 32 characters. Override in any real deployment.
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-string-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Demo data (teacher + students) created on first start when DB is empty ----
app.seed.enabled=${SEED_ENABLED:true}

# Clean 400 for bad JSON / type errors instead of stack traces
server.error.include-message=never
server.error.include-stacktrace=never
