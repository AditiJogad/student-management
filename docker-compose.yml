# Start the database only:  docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: sms-postgres
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - sms-pgdata:/var/lib/postgresql/data

volumes:
  sms-pgdata:
